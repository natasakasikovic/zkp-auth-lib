[workspace]
resolver = "2"
members = [
    "schnorr",
    "auth",
]

[workspace.dependencies]
curve25519-dalek = { version = "4", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "1"